<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        *{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        body{
            background-image: url(Background-image_home.png);
            
        }
        nav{
            height: 50px;
            background: linear-gradient(to bottom, #5A6B87, #3F4F68);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            box-shadow: #0000;
        }
        .navbar-brand{
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px;
            font-size: large;
            font-weight: bold; 
        }
        .nav-link{
            text-decoration: none;
            color: white;
            font-size: medium;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 3px;
        }
        .nav-link:hover{
            background-color: #283957;
        }
        .nav-links{
            margin: 20px;
            display: flex;
            gap: 20px;
        }
        .hhhh{
            color: #0d3066;
            font-weight: 500;
            text-align: center;
            text-decoration: underline;
            text-underline-offset: 15px;
            text-decoration-thickness: 1px;
            text-decoration-color: #0d3066;
        }
        .ppp{
            color: #0d3066;
            text-align: center;
        }
        video{
            height: 200px;
            width: 300px;
            border: 1px solid white;
            display: block;
            margin-left: auto;
            margin-right: 0;
        }
        
    </style>
</head>
<body>
    <nav>
        <div class="navbar-brand">
            ABC Training Institute
        </div>
        <div class="nav-links">
            <a href="Home.html" class="nav-link">Home</a>
            <a href="Courses.html" class="nav-link">Courses</a>
            <a href="Schedule.html" class="nav-link">Schedule</a>
            <a href="Register.html" class="nav-link">Register</a>

        </div>
    </nav>
    <main>
        <h1 class="hhhh">Welcome to ABC Training Institute</h1>
        <p class="ppp">Empowering Your Future with Quality Education</p>
        <video src="https://videocdn.cdnpk.net/videos/35ce5247-ecad-532e-a09e-f58b86abd913/horizontal/previews/magnific_watermarked/large.mp4" controls></video>
    </main>
