<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
    *{
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    body{
        background: url('background-image_schedule.png');
    }
    nav{
            height: 50px;
            background: linear-gradient(to bottom, #5A6B87, #3F4F68);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            box-shadow: #0000;
        }
        .navbar-brand{
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px;
            font-size: large;
            font-weight: bold; 
        }
        .nav-link{
            text-decoration: none;
            color: white;
            font-size: medium;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 3px;
        }
        .nav-link:hover{
            background-color: #283957;
        }
        .nav-links{
            margin: 20px;
            display: flex;
            gap: 20px;
        }
        h1{
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: underline;
            text-underline-offset: 10px;
        }
        th{
            color: white;
            padding: 12px;
            background-color: #b04031;
        }
        table{
            width: 600px;
            text-align: center;
            border-collapse: collapse;
            background-color: #f5f1e8;
            margin: auto;
        }
        td{
            padding: 15px;
            border: 1px solid #d0c8bb;
            font-weight: bold;
        }
        tr:hover{
            background-color: #f0e6d5;
        }
</style>
</head>
<body>
    <nav>
        <div class="navbar-brand">
            ABC Training Institute
        </div>
        <div class="nav-links">
            <a href="Home.html" class="nav-link">Home</a>
            <a href="Courses.html" class="nav-link">Courses</a>
            <a href="Schedule.html" class="nav-link">Schedule</a>
            <a href="Register.html" class="nav-link">Register</a>

        </div>
    </nav>
    <main>
        <h1>Course Schedule</h1>
        <table cellspacing="15px" cellpadding="10px" >
            <thead>
                <th>Course</th>
                <th>Trainer</th>
                <th>Duration</th>
                <th>Mode</th>
            </thead>
            <tbody>
                <tr>
                    <td>HTML & CSS</td>
                    <td>Ashoka</td>
                    <td>2 Weeks</td>
                    <td>Online</td>
                </tr>
                
                <tr>
                    <td>Java</td>
                    <td>Ms.Rahul</td>
                    <td>4 Weeks</td>
                    <td>Offline</td>
                </tr>
                <tr>
                    <td>React JS</td>
                    <td>Mr.Anita</td>
                    <td>3 Weeks</td>
                    <td>Online</td>
                </tr>

            </tbody>
        </table>
    </main>
</body>
</html>
