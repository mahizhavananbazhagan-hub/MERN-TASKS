<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
    *{
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        margin:0;
        padding:0;
        box-sizing:border-box;
    }
    body{
        background-image: url('Background-image_register.png');
    }
    nav{
            height: 50px;
            background: linear-gradient(to bottom, #5A6B87, #3F4F68);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            box-shadow: #0000;
    }
    .navbar-brand{
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px;
            font-size: large;
            font-weight: bold; 
    }
    .nav-link{
            text-decoration: none;
            color: white;
            font-size: medium;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 3px;
    }
    .nav-link:hover{
            background-color: #283957;
    }
    .nav-links{
            margin: 20px;
            display: flex;
            gap: 20px;
    }
    .hhhh{
            color: #ffffff;
            font-weight: 500;
            text-align: center;
            text-decoration: underline;
            text-underline-offset: 15px;
            text-decoration-thickness: 1px;
            text-decoration-color: #ffffff;
        }
    label{
        color: #ffffff;
    }
    .form-container{
    width:600px;
    margin:50px auto;
    padding:20px;
    
    background-size:cover;
    color:white;
    }

.form-group{
    display:flex;
    align-items:center;
    margin-bottom:15px;
}

.form-group label{
    width:120px;
    font-size:18px;
    font-weight:bold;
}

.form-group input,
.form-group select{
    width:260px;
    height:32px;
    border:none;
    padding:5px;
    box-shadow:0 0 5px rgba(0,0,0,0.4);
}

textarea{
    width:390px;
    height:90px;
    border:none;
    resize:none;
    padding:10px;
    box-shadow:0 0 5px rgba(0,0,0,0.4);
}

.radio-group{
    display:flex;
    gap:30px;
    font-size:18px;
}

.btn-box{
    text-align:center;
    margin-top:20px;
}

button{
    padding:12px 40px;
    font-size:18px;
    font-weight:bold;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:3px;

    background:linear-gradient(
        to bottom,
        #d14c42,
        #a32017
    );

    box-shadow:0 4px 8px rgba(0,0,0,0.4);
}

button:hover{
    transform:translateY(-2px);
}
</style>
</head>
<body>
    <nav>
        <div class="navbar-brand">
            ABC Training Institute
        </div>
        <div class="nav-links">
            <a href="Home.html" class="nav-link">Home</a>
            <a href="Courses.html" class="nav-link">Courses</a>
            <a href="Schedule.html" class="nav-link">Schedule</a>
            <a href="Register.html" class="nav-link">Register</a>
        </div>
    </nav>
    <main>
        <h1 class="hhhh">Student Registration</h1>
        <div class="form-container">
    <form>
        <div class="form-group">
            <label>Name:</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="email">
        </div>

        <div class="form-group">
            <label>Phone:</label>
            <input type="tel">
        </div>

        <div class="form-group">
            <label>Select Course:</label>
            <select>
                <option>HTML & CSS</option>
                <option>JavaScript</option>
                <option>Python</option>
            </select>
        </div>

        <div class="form-group">
            <label>Gender:</label>
            <div class="radio-group">
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female
            </div>
        </div>

        <div class="form-group">
            <label>Message:</label>
            <textarea></textarea>
        </div>

        <div class="btn-box">
            <button type="submit">Register Now</button>
        </div>
    </form>
</div>
    </main>
</body>
</html>
