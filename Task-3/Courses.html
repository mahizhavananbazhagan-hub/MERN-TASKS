<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        *{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        body{
            background-image: url('background-image_course.png');
        }
        nav{
            height: 50px;
            background: linear-gradient(to bottom, #5A6B87, #3F4F68);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            box-shadow: #0000;
        }
        .navbar-brand{
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px;
            font-size: large;
            font-weight: bold; 
        }
        .nav-link{
            text-decoration: none;
            color: white;
            font-size: medium;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 3px;
        }
        .nav-link:hover{
            background-color: #283957;
        }
        .nav-links{
            margin: 20px;
            display: flex;
            gap: 20px;
        }
        body>h1{
            color: white;
            font-weight: normal;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        ul{
            color: white;
        }
        div>ul>li>h3{
            font-weight: normal;
        }
        .list-items1,.list-items2{
            display: inline-block;
            justify-content: center;
            align-items: center;
            vertical-align: top;
            margin-right: 80px;
        }
    </style>
</head>
<body>
    <nav>
        <div class="navbar-brand">
            ABC Training Institute
        </div>
        <div class="nav-links">
            <a href="Home.html" class="nav-link">Home</a>
            <a href="Courses.html" class="nav-link">Courses</a>
            <a href="Schedule.html" class="nav-link">Schedule</a>
            <a href="Register.html" class="nav-link">Register</a>
        </div>
    </nav>
    <body>
        <h1>Our Courses</h1>
        <div class="list-items1">
        <ul>
            <li><h3>Web Development</h3></li>
            <li>HTML & CSS</li>
            <li>Javascript</li>
            <li>React JS</li>
        </ul>
        </div>
        <div class="list-items2">
        <ul>
            <li><h3>Programming languages:</h3></li>
            <li>Python</li>
            <li>Java</li>
            <li>C++</li>
        </ul>
        </div>
    </body>
</body>
</html>
